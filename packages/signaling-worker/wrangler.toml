name = "cooperativa-signaling"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://cooperativa-plataforma"

[[kv_namespaces]]
binding = "SIGNALING_KV"
id = "SUBSTITUA_COM_ID_DO_KV_NAMESPACE"
preview_id = "SUBSTITUA_COM_ID_DO_KV_NAMESPACE_PREVIEW"

[triggers]
crons = []

# Free tier: 100k requests/day, 10ms CPU/request
# Suficiente para ~500 conexões simultâneas de sinalização
